<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitHub Explorer</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0d1117;
      color: #e6edf3;
      padding: 16px;
      line-height: 1.5;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid #30363d;
    }

    .header svg {
      width: 24px;
      height: 24px;
      fill: #e6edf3;
      flex-shrink: 0;
    }

    .header h1 {
      font-size: 18px;
      font-weight: 600;
      color: #e6edf3;
    }

    .header .subtitle {
      font-size: 13px;
      color: #8b949e;
      margin-left: auto;
    }

    .card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 14px;
      margin-bottom: 12px;
    }

    .card:hover {
      border-color: #58a6ff;
    }

    .card-title {
      font-size: 16px;
      font-weight: 600;
      color: #58a6ff;
      margin-bottom: 6px;
      word-break: break-word;
    }

    .card-desc {
      font-size: 13px;
      color: #8b949e;
      margin-bottom: 10px;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      font-size: 12px;
      color: #8b949e;
    }

    .card-meta span {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .stat-icon {
      width: 14px;
      height: 14px;
      fill: #8b949e;
    }

    .avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .avatar-large {
      width: 80px;
      height: 80px;
      border-radius: 50%;
    }

    .user-header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 12px;
    }

    .user-info h2 {
      font-size: 18px;
      color: #e6edf3;
    }

    .user-info .login {
      font-size: 14px;
      color: #8b949e;
    }

    .user-bio {
      font-size: 14px;
      color: #c9d1d9;
      margin-bottom: 12px;
    }

    .user-stats {
      display: flex;
      gap: 20px;
      margin-bottom: 12px;
    }

    .user-stats .stat {
      text-align: center;
    }

    .user-stats .stat-num {
      font-size: 18px;
      font-weight: 600;
      color: #e6edf3;
    }

    .user-stats .stat-label {
      font-size: 11px;
      color: #8b949e;
    }

    .user-details {
      font-size: 13px;
      color: #8b949e;
    }

    .user-details div {
      margin-bottom: 4px;
    }

    .label {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 500;
      margin-right: 4px;
      margin-bottom: 4px;
    }

    .issue-row {
      display: flex;
      align-items: flex-start;
      gap: 10px;
    }

    .issue-icon {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
      margin-top: 2px;
    }

    .issue-icon.open { fill: #3fb950; }
    .issue-icon.closed { fill: #f85149; }
    .issue-icon.merged { fill: #a371f7; }

    .pr-badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 500;
    }

    .pr-badge.draft { background: #30363d; color: #8b949e; }
    .pr-badge.open { background: #238636; color: #fff; }
    .pr-badge.closed { background: #da3633; color: #fff; }

    .branch-info {
      font-size: 12px;
      color: #8b949e;
      margin-top: 4px;
    }

    .branch-info code {
      background: #1c2128;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 11px;
      color: #79c0ff;
    }

    .topics {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 10px;
    }

    .topic {
      background: #1c2128;
      color: #58a6ff;
      padding: 4px 10px;
      border-radius: 16px;
      font-size: 12px;
    }

    .repo-detail-stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin: 12px 0;
    }

    .repo-detail-stats .stat-box {
      background: #1c2128;
      padding: 10px;
      border-radius: 6px;
      text-align: center;
    }

    .repo-detail-stats .stat-box .num {
      font-size: 20px;
      font-weight: 600;
      color: #e6edf3;
    }

    .repo-detail-stats .stat-box .lbl {
      font-size: 11px;
      color: #8b949e;
    }

    .empty {
      text-align: center;
      padding: 40px 20px;
      color: #8b949e;
    }
  </style>
</head>
<body>
  <div id="app"></div>

  <script>
    var GITHUB_SVG = '<svg viewBox="0 0 16 16"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>';
    var STAR_SVG = '<svg class="stat-icon" viewBox="0 0 16 16"><path d="M8 .25a.75.75 0 01.673.418l1.882 3.815 4.21.612a.75.75 0 01.416 1.279l-3.046 2.97.719 4.192a.75.75 0 01-1.088.791L8 12.347l-3.766 1.98a.75.75 0 01-1.088-.79l.72-4.194L.818 6.374a.75.75 0 01.416-1.28l4.21-.611L7.327.668A.75.75 0 018 .25z"/></svg>';
    var FORK_SVG = '<svg class="stat-icon" viewBox="0 0 16 16"><path d="M5 3.25a.75.75 0 11-1.5 0 .75.75 0 011.5 0zm0 2.122a2.25 2.25 0 10-1.5 0v.878A2.25 2.25 0 005.75 8.5h1.5v2.128a2.251 2.251 0 101.5 0V8.5h1.5a2.25 2.25 0 002.25-2.25v-.878a2.25 2.25 0 10-1.5 0v.878a.75.75 0 01-.75.75h-4.5A.75.75 0 015 6.25v-.878zm3.75 7.378a.75.75 0 11-1.5 0 .75.75 0 011.5 0zm3-8.75a.75.75 0 100-1.5.75.75 0 000 1.5z"/></svg>';
    var ISSUE_OPEN_SVG = '<svg class="issue-icon open" viewBox="0 0 16 16"><path d="M8 9.5a1.5 1.5 0 100-3 1.5 1.5 0 000 3z"/><path d="M8 0a8 8 0 100 16A8 8 0 008 0zM1.5 8a6.5 6.5 0 1113 0 6.5 6.5 0 01-13 0z"/></svg>';
    var ISSUE_CLOSED_SVG = '<svg class="issue-icon closed" viewBox="0 0 16 16"><path d="M11.28 6.78a.75.75 0 00-1.06-1.06L7.25 8.69 5.78 7.22a.75.75 0 00-1.06 1.06l2 2a.75.75 0 001.06 0l3.5-3.5z"/><path d="M16 8A8 8 0 110 8a8 8 0 0116 0zm-1.5 0a6.5 6.5 0 10-13 0 6.5 6.5 0 0013 0z"/></svg>';
    var PR_SVG = '<svg class="issue-icon open" viewBox="0 0 16 16"><path d="M1.5 3.25a2.25 2.25 0 113 2.122v5.256a2.251 2.251 0 11-1.5 0V5.372A2.25 2.25 0 011.5 3.25zm5.677-.177L9.573.677A.25.25 0 0110 .854V2.5h1A2.5 2.5 0 0113.5 5v5.628a2.251 2.251 0 11-1.5 0V5a1 1 0 00-1-1h-1v1.646a.25.25 0 01-.427.177L7.177 3.427a.25.25 0 010-.354zM3.75 2.5a.75.75 0 100 1.5.75.75 0 000-1.5zm0 9.5a.75.75 0 100 1.5.75.75 0 000-1.5zm8.25.75a.75.75 0 11-1.5 0 .75.75 0 011.5 0z"/></svg>';

    function formatNum(n) {
      if (n >= 1000000) return (n / 1000000).toFixed(1) + 'M';
      if (n >= 1000) return (n / 1000).toFixed(1) + 'k';
      return String(n);
    }

    function formatDate(s) {
      return new Date(s).toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
    }

    function escapeHtml(str) {
      var div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    function renderRepos(data) {
      var html = '<div class="header">' + GITHUB_SVG + '<h1>Repository Search</h1><span class="subtitle">"' + escapeHtml(data.query) + '"</span></div>';
      data.items.forEach(function(r) {
        html += '<div class="card">' +
          '<div class="card-title">' + escapeHtml(r.name) + '</div>' +
          '<div class="card-desc">' + escapeHtml(r.desc) + '</div>' +
          '<div class="card-meta">' +
            '<span>' + STAR_SVG + ' ' + formatNum(r.stars) + '</span>' +
            '<span>' + FORK_SVG + ' ' + formatNum(r.forks) + '</span>' +
            '<span>' + escapeHtml(r.lang) + '</span>' +
            '<span>' + formatDate(r.updated) + '</span>' +
          '</div>' +
        '</div>';
      });
      return html;
    }

    function renderRepoDetail(data) {
      var r = data.item;
      var html = '<div class="header">' + GITHUB_SVG + '<h1>' + escapeHtml(r.name) + '</h1></div>';

      html += '<div class="card">' +
        '<div style="display:flex;align-items:center;gap:12px;margin-bottom:12px">' +
          '<img class="avatar" src="' + escapeHtml(r.avatar) + '" alt="">' +
          '<div><div class="card-title" style="margin-bottom:2px">' + escapeHtml(r.name) + '</div>' +
          '<div class="card-desc" style="margin-bottom:0">' + escapeHtml(r.desc) + '</div></div>' +
        '</div>' +
        '<div class="repo-detail-stats">' +
          '<div class="stat-box"><div class="num">' + formatNum(r.stars) + '</div><div class="lbl">Stars</div></div>' +
          '<div class="stat-box"><div class="num">' + formatNum(r.forks) + '</div><div class="lbl">Forks</div></div>' +
          '<div class="stat-box"><div class="num">' + formatNum(r.watchers) + '</div><div class="lbl">Watchers</div></div>' +
          '<div class="stat-box"><div class="num">' + formatNum(r.issues) + '</div><div class="lbl">Open Issues</div></div>' +
        '</div>' +
        '<div class="card-meta" style="margin-bottom:8px">' +
          '<span>Language: ' + escapeHtml(r.lang) + '</span>' +
          '<span>License: ' + escapeHtml(r.license) + '</span>' +
        '</div>' +
        '<div class="card-meta">' +
          '<span>Created: ' + formatDate(r.created) + '</span>' +
          '<span>Updated: ' + formatDate(r.updated) + '</span>' +
        '</div>';

      if (r.topics && r.topics.length > 0) {
        html += '<div class="topics">';
        r.topics.forEach(function(t) {
          html += '<span class="topic">' + escapeHtml(t) + '</span>';
        });
        html += '</div>';
      }

      html += '</div>';
      return html;
    }

    function renderIssues(data) {
      var html = '<div class="header">' + GITHUB_SVG + '<h1>Issues</h1><span class="subtitle">' + escapeHtml(data.repo) + ' (' + escapeHtml(data.state) + ')</span></div>';
      data.items.forEach(function(issue) {
        var iconSvg = issue.state === 'open' ? ISSUE_OPEN_SVG : ISSUE_CLOSED_SVG;
        html += '<div class="card"><div class="issue-row">' +
          iconSvg +
          '<div>' +
            '<div class="card-title" style="font-size:14px">#' + issue.number + ' ' + escapeHtml(issue.title) + '</div>' +
            '<div class="card-meta" style="margin-bottom:6px">' +
              '<span>By ' + escapeHtml(issue.user) + '</span>' +
              '<span>' + formatDate(issue.created) + '</span>' +
              '<span>' + issue.comments + ' comments</span>' +
            '</div>';
        if (issue.labels && issue.labels.length > 0) {
          issue.labels.forEach(function(l) {
            html += '<span class="label" style="background:#' + escapeHtml(l.color) + ';color:#' + (parseInt(l.color, 16) > 0x7fffff ? '000' : 'fff') + '">' + escapeHtml(l.name) + '</span>';
          });
        }
        html += '</div></div></div>';
      });
      return html;
    }

    function renderPulls(data) {
      var html = '<div class="header">' + GITHUB_SVG + '<h1>Pull Requests</h1><span class="subtitle">' + escapeHtml(data.repo) + ' (' + escapeHtml(data.state) + ')</span></div>';
      data.items.forEach(function(pr) {
        var badgeClass = pr.draft ? 'draft' : pr.state;
        var badgeText = pr.draft ? 'Draft' : (pr.state.charAt(0).toUpperCase() + pr.state.slice(1));
        html += '<div class="card"><div class="issue-row">' +
          PR_SVG +
          '<div>' +
            '<div class="card-title" style="font-size:14px">#' + pr.number + ' ' + escapeHtml(pr.title) + ' <span class="pr-badge ' + badgeClass + '">' + badgeText + '</span></div>' +
            '<div class="card-meta">' +
              '<span>By ' + escapeHtml(pr.user) + '</span>' +
              '<span>' + formatDate(pr.created) + '</span>' +
            '</div>' +
            '<div class="branch-info"><code>' + escapeHtml(pr.head) + '</code> &#8594; <code>' + escapeHtml(pr.base) + '</code></div>' +
          '</div></div></div>';
      });
      return html;
    }

    function renderUser(data) {
      var u = data.item;
      var html = '<div class="header">' + GITHUB_SVG + '<h1>User Profile</h1></div>';
      html += '<div class="card">' +
        '<div class="user-header">' +
          '<img class="avatar-large" src="' + escapeHtml(u.avatar) + '" alt="">' +
          '<div class="user-info">' +
            '<h2>' + escapeHtml(u.name || u.login) + '</h2>' +
            '<div class="login">@' + escapeHtml(u.login) + '</div>' +
          '</div>' +
        '</div>';

      if (u.bio) {
        html += '<div class="user-bio">' + escapeHtml(u.bio) + '</div>';
      }

      html += '<div class="user-stats">' +
        '<div class="stat"><div class="stat-num">' + u.repos + '</div><div class="stat-label">Repos</div></div>' +
        '<div class="stat"><div class="stat-num">' + formatNum(u.followers) + '</div><div class="stat-label">Followers</div></div>' +
        '<div class="stat"><div class="stat-num">' + formatNum(u.following) + '</div><div class="stat-label">Following</div></div>' +
      '</div>';

      html += '<div class="user-details">';
      if (u.company) html += '<div>&#127970; ' + escapeHtml(u.company) + '</div>';
      if (u.location) html += '<div>&#128205; ' + escapeHtml(u.location) + '</div>';
      if (u.blog) html += '<div>&#128279; ' + escapeHtml(u.blog) + '</div>';
      if (u.twitter) html += '<div>&#128038; @' + escapeHtml(u.twitter) + '</div>';
      html += '<div>&#128197; Joined ' + formatDate(u.created) + '</div>';
      html += '</div></div>';

      return html;
    }

    function init() {
      var app = document.getElementById('app');
      var params = new URLSearchParams(window.location.search);
      var raw = params.get('data');

      if (!raw) {
        app.innerHTML = '<div class="empty">No data provided.</div>';
        return;
      }

      try {
        var data = JSON.parse(decodeURIComponent(raw));

        switch (data.type) {
          case 'repos':
            app.innerHTML = renderRepos(data);
            break;
          case 'repo':
            app.innerHTML = renderRepoDetail(data);
            break;
          case 'issues':
            app.innerHTML = renderIssues(data);
            break;
          case 'pulls':
            app.innerHTML = renderPulls(data);
            break;
          case 'user':
            app.innerHTML = renderUser(data);
            break;
          default:
            app.innerHTML = '<div class="empty">Unknown data type: ' + escapeHtml(data.type) + '</div>';
        }
      } catch (e) {
        app.innerHTML = '<div class="empty">Error parsing data: ' + escapeHtml(e.message) + '</div>';
      }
    }

    init();
  </script>
</body>
</html>
