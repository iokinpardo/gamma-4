<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitHub Explorer</title>
</head>
<body>
<script>
  var GITHUB_API = 'https://api.github.com';

  function githubRequest(endpoint, token) {
    return new Promise(function(resolve, reject) {
      try {
        var xhr = new XMLHttpRequest();
        xhr.open('GET', GITHUB_API + endpoint, true);
        if (token) {
          xhr.setRequestHeader('Authorization', 'token ' + token);
        }
        xhr.timeout = 15000;
        xhr.onload = function() {
          if (xhr.status >= 200 && xhr.status < 300) {
            try { resolve(JSON.parse(xhr.responseText)); }
            catch(e) { reject('Invalid JSON from GitHub'); }
          } else {
            reject('GitHub API returned status ' + xhr.status);
          }
        };
        xhr.onerror = function() { reject('Network error contacting GitHub API'); };
        xhr.ontimeout = function() { reject('Request timed out after 15s'); };
        xhr.send();
      } catch(e) {
        reject('XHR setup failed: ' + e.message);
      }
    });
  }

  function fmtNum(n) {
    if (n >= 1000000) return (n / 1000000).toFixed(1) + 'M';
    if (n >= 1000) return (n / 1000).toFixed(1) + 'k';
    return String(n);
  }

  function fmtDate(s) {
    try { return new Date(s).toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' }); }
    catch(e) { return s; }
  }

  async function doSearchRepos(p, token) {
    var q = encodeURIComponent(p.query);
    var sort = p.sort || 'stars';
    var order = p.order || 'desc';
    var perPage = Math.min(p.per_page || 5, 10);
    var data = await githubRequest('/search/repositories?q=' + q + '&sort=' + sort + '&order=' + order + '&per_page=' + perPage, token);
    if (!data.items || data.total_count === 0) return { message: 'No repositories found for "' + p.query + '".' };
    var lines = ['Found ' + fmtNum(data.total_count) + ' repositories:\n'];
    data.items.forEach(function(r, i) {
      lines.push((i+1) + '. ' + r.full_name + ' (' + fmtNum(r.stargazers_count) + ' stars)');
      lines.push('   ' + (r.description || 'No description'));
      lines.push('   ' + (r.language || '') + ' | Forks: ' + fmtNum(r.forks_count));
      lines.push('');
    });
    return { message: lines.join('\n') };
  }

  async function doGetRepo(p, token) {
    var d = await githubRequest('/repos/' + p.owner + '/' + p.repo, token);
    var lines = [
      d.full_name, d.description || 'No description', '',
      'Stars: ' + fmtNum(d.stargazers_count) + ' | Forks: ' + fmtNum(d.forks_count),
      'Language: ' + (d.language || 'N/A') + ' | License: ' + (d.license ? d.license.spdx_id : 'None'),
      'Open Issues: ' + fmtNum(d.open_issues_count),
      'Created: ' + fmtDate(d.created_at) + ' | Updated: ' + fmtDate(d.updated_at)
    ];
    if (d.topics && d.topics.length) lines.push('Topics: ' + d.topics.join(', '));
    return { message: lines.join('\n') };
  }

  async function doListIssues(p, token) {
    var state = p.state || 'open';
    var perPage = Math.min(p.per_page || 5, 10);
    var data = await githubRequest('/repos/' + p.owner + '/' + p.repo + '/issues?state=' + state + '&per_page=' + perPage, token);
    if (!data || data.length === 0) return { message: 'No ' + state + ' issues in ' + p.owner + '/' + p.repo };
    var lines = [state.charAt(0).toUpperCase() + state.slice(1) + ' issues in ' + p.owner + '/' + p.repo + ':\n'];
    var count = 0;
    data.forEach(function(issue) {
      if (issue.pull_request) return;
      count++;
      lines.push(count + '. #' + issue.number + ' ' + issue.title);
      lines.push('   By ' + issue.user.login + ' | ' + fmtDate(issue.created_at));
      lines.push('');
    });
    if (count === 0) return { message: 'No ' + state + ' issues found (only PRs).' };
    return { message: lines.join('\n') };
  }

  async function doListPulls(p, token) {
    var state = p.state || 'open';
    var perPage = Math.min(p.per_page || 5, 10);
    var data = await githubRequest('/repos/' + p.owner + '/' + p.repo + '/pulls?state=' + state + '&per_page=' + perPage, token);
    if (!data || data.length === 0) return { message: 'No ' + state + ' pull requests in ' + p.owner + '/' + p.repo };
    var lines = [state.charAt(0).toUpperCase() + state.slice(1) + ' PRs in ' + p.owner + '/' + p.repo + ':\n'];
    data.forEach(function(pr, i) {
      lines.push((i+1) + '. #' + pr.number + ' ' + pr.title);
      lines.push('   By ' + pr.user.login + ' | ' + pr.head.ref + ' -> ' + pr.base.ref);
      lines.push('');
    });
    return { message: lines.join('\n') };
  }

  async function doGetUser(p, token) {
    var d = await githubRequest('/users/' + p.username, token);
    var lines = [
      d.login + (d.name ? ' (' + d.name + ')' : ''),
      d.bio || '', '',
      'Public Repos: ' + d.public_repos,
      'Followers: ' + fmtNum(d.followers) + ' | Following: ' + fmtNum(d.following),
      'Joined: ' + fmtDate(d.created_at)
    ];
    if (d.company) lines.push('Company: ' + d.company);
    if (d.location) lines.push('Location: ' + d.location);
    if (d.blog) lines.push('Blog: ' + d.blog);
    return { message: lines.join('\n') };
  }

  window['ai_edge_gallery_get_result'] = async function(data, secret) {
    try {
      var params;
      if (typeof data === 'string') {
        params = JSON.parse(data);
      } else if (typeof data === 'object' && data !== null) {
        params = data;
      } else {
        return JSON.stringify({ message: 'Error: invalid data type: ' + typeof data });
      }

      var token = '';
      if (secret && typeof secret === 'string' && secret.trim() !== '') {
        token = secret.trim();
      }

      var result;
      var action = params.action || '';

      if (action === 'search_repos') {
        result = await doSearchRepos(params, token);
      } else if (action === 'get_repo') {
        result = await doGetRepo(params, token);
      } else if (action === 'list_issues') {
        result = await doListIssues(params, token);
      } else if (action === 'list_pulls') {
        result = await doListPulls(params, token);
      } else if (action === 'get_user') {
        result = await doGetUser(params, token);
      } else {
        result = { message: 'Unknown action: ' + action };
      }

      return JSON.stringify(result);
    } catch (err) {
      var errMsg = (typeof err === 'string') ? err : (err.message || 'Unknown error');
      return JSON.stringify({ message: 'Error: ' + errMsg });
    }
  };
</script>
</body>
</html>
